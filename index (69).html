document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"48ce738b-7bf0-47be-bd82-20e18bb32c1c\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"3adecbb6-ea1b-40e4-b524-11f8f931a09e\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"82ee8bcc-71b7-4e49-b4aa-980af794e81c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"96729f40-0bff-4746-bc7a-a5ff0713cfbd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ===== EXA SEGUROS — APP STYLES ===== */\n*{box-sizing:border-box;margin:0;padding:0;}\n:root{\n  --bg:#EDEAE3;\n  --surface:#FFFFFF;\n  --ink:#0A0A0B;\n  --ink-2:#52524F;\n  --muted:#9A9A95;\n  --line:#E4E0D6;\n  --accent:#FF5F2E;\n  --accent-soft:#FFE9DF;\n  --emerald:#0D6E58;\n  --emerald-soft:#D6EDE5;\n  --indigo:#1E2752;\n  --indigo-soft:#DCDFEC;\n  --plum:#5E2A6E;\n  --plum-soft:#E8DAEC;\n  --amber:#C28B00;\n  --amber-soft:#F8EAC0;\n  --display:'Bricolage Grotesque', sans-serif;\n  --sans:'Manrope', sans-serif;\n  --mono:'JetBrains Mono', monospace;\n}\nhtml,body{height:100%;}\nbody{\n  font-family:var(--sans);\n  background:var(--bg);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  min-height:100vh;\n}\n\n/* ===== APP SHELL (responsive, no device frame) ===== */\n.stage{\n  width:100%;min-height:100vh;\n  display:flex;align-items:stretch;justify-content:center;\n}\n.phone{\n  width:100%;max-width:520px;min-height:100vh;\n  background:#fff;\n  overflow:hidden;\n  position:relative;\n  display:flex;flex-direction:column;\n  margin:0 auto;\n}\n\n/* status bar */\n.statusbar{\n  flex-shrink:0;height:46px;\n  display:flex;align-items:center;justify-content:space-between;\n  padding:14px 26px 0;\n  font-family:var(--mono);font-size:13px;font-weight:600;\n  position:relative;z-index:30;\n}\n.statusbar .ind{display:flex;gap:6px;align-items:center;}\n.statusbar .bar{width:16px;height:9px;border-radius:2px;border:1.2px solid var(--ink);position:relative;}\n.statusbar .bar::after{content:'';position:absolute;inset:1.5px;width:8px;background:var(--ink);border-radius:1px;}\n.statusbar.dark{color:#fff;}\n.statusbar.dark .bar{border-color:#fff;}\n.statusbar.dark .bar::after{background:#fff;}\n\n/* viewport holds screens */\n.viewport{flex:1;position:relative;overflow:hidden;}\n.screen{\n  position:absolute;inset:0;\n  display:none;\n  flex-direction:column;\n  background:#fff;\n  overflow-y:auto;\n  -ms-overflow-style:none;scrollbar-width:none;\n}\n.screen::-webkit-scrollbar{display:none;}\n.screen.active{display:flex;z-index:2;opacity:1;transform:none;}\n.screen.dark{background:#16161a;color:#fff;}\n/* white dashboard */\n#s-home{background:#fff;}\n.phone.home-bg{background:#fff;}\n\n/* ===== TYPO ===== */\n.lbl{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;}\n.lbl.ac{color:var(--accent);}\n.h-display{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-0.03em;}\n.h-display em{font-style:italic;font-weight:500;color:var(--ink-2);}\n.body-s{font-size:13px;line-height:1.55;color:var(--ink-2);}\n.pad{padding:18px 20px;}\n.link{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}\n.muted-link{font-family:var(--display);font-style:italic;font-size:18px;color:var(--ink);cursor:pointer;}\n\n/* ===== BUTTONS ===== */\n.btn{\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  width:100%;padding:15px 18px;border-radius:14px;\n  font-family:var(--sans);font-weight:700;font-size:14px;letter-spacing:0.01em;\n  border:none;cursor:pointer;transition:transform 0.12s, opacity 0.15s;\n}\n.btn:active{transform:scale(0.97);}\n.btn.primary{background:var(--ink);color:#fff;}\n.btn.accent{background:var(--accent);color:#fff;}\n.btn.ghost{background:#F4F1EA;color:var(--ink);border:1px solid var(--line);}\n.btn.sm{width:auto;padding:10px 16px;font-size:12px;}\n.btn .arr{font-size:18px;line-height:1;}\n.btn[disabled]{opacity:0.4;cursor:not-allowed;}\n\n/* ===== INPUTS ===== */\n.input{\n  width:100%;padding:14px 16px;border-radius:14px;\n  background:#F4F1EA;border:1px solid var(--line);\n  font-family:var(--sans);font-size:14px;color:var(--ink);\n  outline:none;font-weight:500;\n}\n.input::placeholder{color:var(--muted);}\n.input:focus{border-color:var(--ink);background:#fff;}\n.input-wrap{margin-bottom:14px;}\n.input-wrap .lbl{margin-bottom:8px;display:block;}\n.field-err{border-color:#d33!important;background:#fff4f4!important;}\n.err-msg{color:#d33;font-size:11px;margin-top:5px;font-weight:600;min-height:0;}\n.ta{\n  width:100%;padding:12px 14px;border-radius:14px;\n  background:#F4F1EA;border:1px solid var(--line);\n  font-family:var(--sans);font-size:13px;color:var(--ink);\n  outline:none;font-weight:500;resize:none;min-height:84px;line-height:1.5;\n}\n.ta:focus{border-color:var(--ink);background:#fff;}\n\n/* ===== CHIPS ===== */\n.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:#F4F1EA;border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink);}\n.chip.ac{background:var(--accent-soft);border-color:transparent;color:var(--accent);}\n.chip.em{background:var(--emerald-soft);border-color:transparent;color:var(--emerald);}\n.chip.in{background:var(--indigo-soft);border-color:transparent;color:var(--indigo);}\n.chip.pl{background:var(--plum-soft);border-color:transparent;color:var(--plum);}\n.chip.am{background:var(--amber-soft);border-color:transparent;color:var(--amber);}\n\n/* dots */\n.dots{display:flex;gap:6px;align-items:center;}\n.dots .d{width:6px;height:6px;border-radius:50%;background:var(--line);}\n.dots .d.on{width:18px;border-radius:3px;background:var(--ink);}\n\n/* ===== HERO SOFT ===== */\n.hero-soft{background:var(--accent-soft);border-radius:24px;padding:18px 20px;position:relative;overflow:hidden;}\n.hero-soft.em{background:var(--emerald-soft);}\n.hero-soft.in{background:var(--indigo-soft);}\n.hero-soft.pl{background:var(--plum-soft);}\n.hero-soft.am{background:var(--amber-soft);}\n.hero-soft .blob{position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.45);top:-40px;right:-40px;}\n\n/* row item */\n.row-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);}\n.row-item:last-child{border-bottom:none;}\n.badge-ix{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-family:var(--mono);font-size:11px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink);}\n.row-item .nm{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-0.01em;line-height:1.1;}\n.row-item .ds{font-size:11px;color:var(--ink-2);line-height:1.45;margin-top:3px;}\n.row-item .arr{color:var(--muted);font-family:var(--display);font-style:italic;font-size:18px;}\n\n/* ===== POLICY CARDS (wallet) ===== */\n.pol{border-radius:20px;padding:14px 18px 18px;position:relative;overflow:hidden;cursor:pointer;transition:transform 0.2s, box-shadow 0.2s;color:#fff;}\n.pol.coral{background:#E50914;}\n.pol.emerald{background:#1DB954;}\n.pol.indigo{background:#1E90FF;}\n.pol.plum{background:#7A2AA0;}\n.pol.amber{background:var(--amber);}\n.pol.ink{background:var(--ink);}\n.pol .top{display:flex;justify-content:space-between;align-items:flex-start;min-height:44px;margin-bottom:18px;}\n.pol .lbl{color:rgba(255,255,255,0.7);}\n.pol .ttl{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.05;letter-spacing:-0.02em;margin-top:2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:2.15em;}\n.pol .ttl em{font-style:italic;font-weight:400;}\n.pol .meta{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:0.04em;text-align:right;}\n.pol .row{display:flex;justify-content:space-between;align-items:flex-end;padding-top:14px;border-top:1px solid rgba(255,255,255,0.18);min-height:50px;}\n.pol .row .price{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1;}\n.pol .row .price small{font-weight:400;font-size:13px;opacity:0.75;letter-spacing:0;}\n.pol .row .stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.85);font-weight:600;}\n.pol .row .stat .d{width:6px;height:6px;border-radius:50%;background:#7DEAA0;}\n.pol .glyph{position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,0.06);}\n\n.wallet-stack{display:flex;flex-direction:column;}\n.wallet-stack > .pol{box-shadow:0 -4px 16px rgba(10,10,11,0.08);}\n.wallet-stack > .pol + .pol{margin-top:-88px;}\n.wallet-stack > .pol:hover,.wallet-stack > .pol.lifted{transform:translateY(-8px);z-index:10;box-shadow:0 14px 30px rgba(10,10,11,0.22);}\n.pol-add{margin-top:14px;border:1.5px dashed #c9c3b4;border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2);font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;background:transparent;transition:all 0.15s;}\n.pol-add:hover{border-color:var(--ink);color:var(--ink);background:rgba(255,95,46,0.03);}\n.pol-add .plus{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;}\n\n/* segmented */\n.seg{display:flex;background:#F4F1EA;border-radius:12px;padding:4px;gap:4px;}\n.seg .b{flex:1;padding:9px 0;text-align:center;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--ink-2);}\n.seg .b.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(10,10,11,0.06);}\n\n/* metric / kv */\n.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;}\n.kv .k{color:var(--ink-2);}\n.kv .v{font-weight:600;font-family:var(--mono);font-size:12px;}\n.metric{background:#F4F1EA;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;}\n\n/* tabbar — floating pill, iOS-style */\n.tabbar-fade{\n  position:sticky; bottom:0; z-index:5;\n  height:14px; flex-shrink:0;\n  background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.9));\n  pointer-events:none;\n  margin-bottom:-14px;\n}\n.tabbar{\n  position:sticky; bottom:14px; z-index:6;\n  display:flex; align-items:center; justify-content:space-around;\n  gap:6px;\n  background:rgba(255,255,255,0.75);\n  backdrop-filter: blur(18px) saturate(160%);\n  -webkit-backdrop-filter: blur(18px) saturate(160%);\n  border:1px solid rgba(20,20,20,0.06);\n  border-radius:999px;\n  padding:6px;\n  margin:0 22px 18px;\n  box-shadow:\n    0 12px 30px -8px rgba(20,20,20,0.18),\n    0 4px 10px -4px rgba(20,20,20,0.10);\n  flex-shrink:0;\n}\n.tabbar .t{\n  flex:0 0 auto;\n  display:flex; align-items:center; justify-content:center;\n  gap:7px;\n  padding:9px 12px;\n  border-radius:999px;\n  font-size:11px; font-weight:600; letter-spacing:0.02em;\n  cursor:pointer; color:var(--ink-2);\n  transition:background 0.2s, color 0.2s, padding 0.2s;\n  white-space:nowrap;\n}\n.tabbar .t .lbl-t{ display:none; }\n.tabbar .t.on{\n  background:var(--ink); color:#fff;\n  padding:9px 16px 9px 10px;\n}\n.tabbar .t.on .lbl-t{ display:inline; text-transform:capitalize; }\n.tabbar .t .ic{\n  display:inline-flex; align-items:center; justify-content:center;\n  width:22px; height:22px; border-radius:50%;\n  background:rgba(20,20,20,0.06);\n  color:var(--ink);\n  font-family:var(--display); font-style:normal; font-weight:700;\n  font-size:11px; letter-spacing:-0.02em;\n  transition:background 0.2s, color 0.2s;\n}\n.tabbar .t.on .ic{\n  background:#fff; color:var(--ink);\n}\n.tabbar .t:not(.on) .ic{\n  background:var(--accent); color:#fff;\n}\n\n/* avatar */\n.avatar{width:40px;height:40px;border-radius:14px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:-0.02em;}\n\n/* switch */\n.sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex-shrink:0;transition:background 0.2s;}\n.sw .sw-th{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;box-shadow:0 2px 4px rgba(10,10,11,0.15);transition:transform 0.2s;}\n[data-on=\"1\"] .sw{background:var(--accent);}\n[data-on=\"1\"] .sw .sw-th{transform:translateX(16px);}\n\n/* pick rows */\n.pick{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px;cursor:pointer;transition:border-color 0.15s, background 0.15s;}\n.pick:hover{border-color:var(--ink);}\n.pick.on{border-color:var(--ink);background:#F4F1EA;}\n.pick .swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}\n.pick .info{flex:1;min-width:0;}\n.pick .info .nm{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-0.01em;line-height:1.1;}\n.pick .info .ds{font-size:10px;color:var(--ink-2);margin-top:2px;}\n.pick .check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:transparent;transition:all 0.15s;}\n.pick.on .check{background:var(--ink);border-color:var(--ink);color:#fff;}\n\n/* settings list */\n.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}\n.list .li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;gap:12px;}\n.list .li:last-child{border-bottom:none;}\n.list .li .li-k{font-size:10px;color:var(--ink-2);font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;font-weight:600;}\n.list .li .li-v{font-size:13px;margin-top:2px;}\n.list .li .nm{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:-0.01em;}\n.list .li .ds{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.4;}\n\n/* ===== SHEETS ===== */\n.sheet-wrap{position:absolute;inset:0;z-index:50;background:rgba(10,10,11,0.4);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}\n.sheet-wrap.open{display:flex;animation:fadeIn 0.2s ease-out;}\n@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}\n@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}\n.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:18px 20px 24px;max-height:90%;overflow-y:auto;animation:slideUp 0.3s cubic-bezier(0.32,0.72,0,1);-ms-overflow-style:none;scrollbar-width:none;}\n.sheet::-webkit-scrollbar{display:none;}\n.sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;}\n.sheet .ttl{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}\n.sheet .ttl h3{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-0.02em;line-height:1.05;}\n.sheet .ttl h3 em{font-style:italic;font-weight:500;color:var(--ink-2);}\n.sheet .ttl .x{width:28px;height:28px;border-radius:50%;background:#F4F1EA;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--ink);font-size:16px;line-height:1;flex-shrink:0;}\n.sheet .sub{font-size:12px;color:var(--ink-2);margin-bottom:16px;}\n\n/* toast */\n.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:12px;font-weight:600;letter-spacing:0.01em;opacity:0;pointer-events:none;transition:all 0.3s;z-index:200;display:flex;align-items:center;gap:8px;max-width:80%;text-align:left;}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}\n.toast .ck{width:18px;height:18px;border-radius:50%;background:#22C55E;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0;}\n\n/* notification banner */\n.notif-banner{position:absolute;top:54px;left:14px;right:14px;z-index:120;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 14px 40px rgba(10,10,11,0.2);transform:translateY(-200%);visibility:hidden;transition:transform 0.4s cubic-bezier(0.32,0.72,0,1),visibility 0.4s;cursor:pointer;}\n.notif-banner.show{transform:translateY(0);visibility:visible;}\n\nimage-slot{display:block;}\n\n/* card colour swatches (add policy) */\n.cardsw{width:30px;height:30px;border-radius:9px;cursor:pointer;flex-shrink:0;border:2px solid transparent;box-shadow:0 0 0 1px rgba(0,0,0,0.06) inset;transition:transform 0.12s;}\n.cardsw:hover{transform:scale(1.08);}\n.cardsw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ink);}\n.debit-note{margin-top:2px;background:#F4F1EA;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.45;color:var(--ink-2);}\n.debit-note b{color:var(--ink);}\ninput[readonly]{cursor:default;}\n\n\n/* ===== MOTION ===== */\n@keyframes exa-screen-in {\n  from { opacity: 0; transform: translateY(8px); }\n  to   { opacity: 1; transform: none; }\n}\n@keyframes exa-card-in {\n  from { opacity: 0; transform: translateY(14px) scale(0.98); }\n  to   { opacity: 1; transform: none; }\n}\n@keyframes exa-sheet-in {\n  from { transform: translateY(100%); }\n  to   { transform: translateY(0); }\n}\n@keyframes exa-spin {\n  to { transform: rotate(360deg); }\n}\n@keyframes exa-ripple {\n  from { transform: scale(0); opacity: 0.35; }\n  to   { transform: scale(2.6); opacity: 0; }\n}\n@keyframes exa-toast-in {\n  from { opacity: 0; transform: translate(-50%, 14px) scale(0.96); }\n  to   { opacity: 1; transform: translate(-50%, 0) scale(1); }\n}\n@keyframes exa-pop {\n  0%   { transform: scale(1); }\n  40%  { transform: scale(0.95); }\n  100% { transform: scale(1); }\n}\n@keyframes exa-progress {\n  from { width: 0; }\n}\n\n/* screen entrance */\n.screen.active { animation: exa-screen-in 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) both; }\n\n/* wallet cards stagger */\n.wallet-stack > .pol,\n.wallet-stack > .pol-add {\n  animation: exa-card-in 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) both;\n}\n.wallet-stack > *:nth-child(1) { animation-delay: 0.02s; }\n.wallet-stack > *:nth-child(2) { animation-delay: 0.08s; }\n.wallet-stack > *:nth-child(3) { animation-delay: 0.14s; }\n.wallet-stack > *:nth-child(4) { animation-delay: 0.20s; }\n.wallet-stack > *:nth-child(5) { animation-delay: 0.26s; }\n.wallet-stack > *:nth-child(6) { animation-delay: 0.32s; }\n\n/* pop when pol appears via JS */\n.pol.exa-pop { animation: exa-pop 0.35s ease-out; }\n\n/* button press ripple */\n.btn { position: relative; overflow: hidden; }\n.btn .ripple {\n  position: absolute; border-radius: 50%;\n  background: currentColor; opacity: 0.28;\n  pointer-events: none; transform: scale(0);\n  animation: exa-ripple 0.55s ease-out forwards;\n}\n\n/* loading state on any button */\n.btn.is-loading { pointer-events: none; opacity: 0.9; }\n.btn.is-loading > *:not(.spinner) { visibility: hidden; }\n.btn .spinner {\n  position: absolute; top: 50%; left: 50%;\n  width: 18px; height: 18px; margin: -9px 0 0 -9px;\n  border: 2px solid currentColor; border-top-color: transparent;\n  border-radius: 50%;\n  animation: exa-spin 0.7s linear infinite;\n}\n\n/* toast entrance */\n.toast.show { animation: exa-toast-in 0.28s cubic-bezier(0.22, 0.61, 0.36, 1) both; }\n\n/* pick tap feedback */\n.pick { transition: border-color 0.15s, background 0.15s, transform 0.12s; }\n.pick:active { transform: scale(0.98); }\n\n/* sheet slide-up (idempotent — reinforce) */\n.sheet-wrap.open .sheet { animation: exa-sheet-in 0.32s cubic-bezier(0.22, 0.61, 0.36, 1); }\n\n/* progress bar grow */\n.progress-bar > .fill { animation: exa-progress 0.6s ease-out both; }\n\n/* skeleton shimmer for empty states */\n@keyframes exa-shimmer {\n  0%   { background-position: -400px 0; }\n  100% { background-position: 400px 0; }\n}\n.skeleton {\n  background: linear-gradient(90deg, #f0ece2 0%, #faf7ee 50%, #f0ece2 100%);\n  background-size: 800px 100%;\n  animation: exa-shimmer 1.4s linear infinite;\n  border-radius: 8px;\n}\n\n/* respect reduced motion */\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n}\n\n\n/* ===== BUTTON TONES (match policy cards) ===== */\n.btn.tone-coral   { background: #E50914; color: #fff; }\n.btn.tone-emerald { background: #1DB954; color: #fff; }\n.btn.tone-indigo  { background: #1E90FF; color: #fff; }\n.btn.tone-plum    { background: #7A2AA0; color: #fff; }\n.btn.tone-amber   { background: var(--amber); color: #fff; }\n.btn.tone-ink     { background: var(--ink); color: #fff; }\n\n\n/* ===== INTRO SKETCH ===== */\n#s-intro{background:#fff;overflow:hidden;}\n#s-intro::after{content:\"\";position:absolute;inset:0;pointer-events:none;opacity:0.5;background-image:radial-gradient(rgba(10,10,11,0.045) 0.5px, transparent 0.6px);background-size:3px 3px;}\n.intro-sk{position:absolute;left:0;right:0;bottom:0;height:58%;}\n.intro-svg{width:100%;height:100%;display:block;}\n.intro-svg path,.intro-svg circle{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}\n.sk-far{opacity:0.3;animation:skDrift 34s linear infinite;}\n.sk-far path{stroke-width:1.2;}\n.intro-svg .win{stroke-width:0.8;opacity:0.55;}\n.intro-svg .roof{stroke-width:1.1;}\n.sk-ground{opacity:0.65;}\n.sk-kerb{opacity:0.22;stroke-dasharray:5 7;}\n@keyframes skDrift{from{transform:translateX(0);}to{transform:translateX(-400px);}}\n.walker{opacity:0.82;}\n.walker circle,.walker path{stroke-width:1.6;}\n.walker .leg-a,.walker .leg-b,.walker .arm-a,.walker .arm-b{transform-box:fill-box;transform-origin:50% 0%;}\n.walker .leg-a{animation:stepA 0.62s ease-in-out infinite;}\n.walker .leg-b{animation:stepB 0.62s ease-in-out infinite;}\n.walker .arm-a{animation:swingA 0.62s ease-in-out infinite;}\n.walker .arm-b{animation:swingB 0.62s ease-in-out infinite;}\n@keyframes stepA{0%,100%{transform:rotate(14deg);}50%{transform:rotate(-16deg);}}\n@keyframes stepB{0%,100%{transform:rotate(-16deg);}50%{transform:rotate(14deg);}}\n@keyframes swingA{0%,100%{transform:rotate(-13deg);}50%{transform:rotate(12deg);}}\n@keyframes swingB{0%,100%{transform:rotate(12deg);}50%{transform:rotate(-13deg);}}\n@keyframes crossR{from{transform:translate(-50px,170px);}to{transform:translate(450px,170px);}}\n@keyframes crossL{from{transform:translate(450px,170px) scaleX(-1);}to{transform:translate(-50px,170px) scaleX(-1);}}\n.w1{animation:crossR 13s linear infinite;}\n.w2{animation:crossL 17s linear infinite;animation-delay:-4s;}\n.w3{animation:crossR 10.5s linear infinite;animation-delay:-6s;}\n.w4{animation:crossL 21s linear infinite;animation-delay:-12s;}\n.intro-mark{position:absolute;left:26px;top:74px;z-index:2;}\n.intro-lbl{font-family:var(--mono);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-2);font-weight:600;}\n.intro-name{font-family:var(--display);font-size:52px;font-weight:700;letter-spacing:-0.045em;line-height:0.9;color:var(--ink);margin-top:10px;}\n.intro-sub{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:12px;}\n.intro-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;max-width:250px;}\n.intro-skip{position:absolute;right:20px;top:20px;z-index:3;font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;}\n.intro-skip:active{background:#fff;}\n@media (prefers-reduced-motion: reduce){.sk-far,.walker,.walker path{animation:none;}.w1{transform:translate(70px,170px);}.w2{transform:translate(180px,170px) scaleX(-1);}.w3{transform:translate(280px,170px);}.w4{transform:translate(350px,170px) scaleX(-1);}}\n.pol-empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:20px 18px;text-align:center;}\n.pol-empty .pe-lbl{font-family:var(--mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;}\n.pol-empty .pe-txt{font-size:12px;line-height:1.55;color:var(--ink-2);margin-top:8px;text-wrap:pretty;}\n.pol-empty .pe-btn{margin-top:14px;padding:9px 16px;border-radius:10px;background:var(--ink);color:#fff;border:none;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;cursor:pointer;}\n.wallet-widgets .wgt{\n  position:relative;\n  background:#fff;\n  border:1px solid var(--line);\n  border-radius:20px;\n  padding:14px 14px 12px;\n  overflow n-bottom:14px;\">O presente cartão oferta no valor de 50€ está sujeito ao cumprimento cumulativo das condições abaixo descritas:<\u002Fp>\n\n          <div style=\"font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;\">1 · Elegibilidade da Apólice<\u002Fdiv>\n          <p style=\"margin-bottom:6px;\"><b style=\"color:var(--ink);\">1.1.<\u002Fb> A apólice apenas será elegível para atribuição do cartão oferta caso o primeiro pagamento seja cobrado nos primeiros 3 (três) meses após o início do contrato, quando o cliente optar por fracionamento mensal.<\u002Fp>\n          <p style=\"margin-bottom:14px;\"><b style=\"color:var(--ink);\">1.2.<\u002Fb> Caso o cliente opte por fracionamento trimestral, semestral ou anual, a apólice torna-se elegível de forma imediata, sendo o cartão oferta emitido após a entrada em vigor do contrato e confirmação do primeiro pagamento.<\u002Fp>\n\n          <div style=\"font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;\">2 · Seguro de Saúde — Prémio entre 600€ e 1.399€<\u002Fdiv>\n          <p style=\"margin-bottom:6px;\"><b style=\"color:var(--ink);\">2.1.<\u002Fb> Para seguros de saúde com prémio anual igual ou superior a 600€ e inferior ou igual a 1.399€, a atribuição do cartão oferta está condicionada a fracionamento mínimo semestral no primeiro ano de contrato.<\u002Fp>\n          <p style=\"margin-bottom:6px;\"><b style=\"color:var(--ink);\">2.2.<\u002Fb> Durante o primeiro ano, não é permitido fracionamento mensal para efeitos de elegibilidade ao cartão oferta nesta faixa de prémio.<\u002Fp>\n          <p style=\"margin-bottom:14px;\"><b style=\"color:var(--ink);\">2.3.<\u002Fb> Na data de renovação anual, o tomador do seguro poderá alterar o fracionamento da apólice, de acordo com as condições em vigor.<\u002Fp>\n\n          <div style=\"font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;\">3 · Seguro de Saúde — Prémio igual ou superior a 1.400€<\u002Fdiv>\n          <p style=\"margin-bottom:6px;\"><b style=\"color:var(--ink);\">3.1.<\u002Fb> Para seguros de saúde com prémio anual igual ou superior a 1.400€, a apólice é automaticamente elegível para o cartão oferta de 50€.<\u002Fp>\n          <p style=\"margin-bottom:6px;\"><b style=\"color:var(--ink);\">3.2.<\u002Fb> A elegibilidade é imediata após a entrada em vigor da apólice e confirmação do primeiro pagamento, independentemente do tipo de fracionamento escolhido.<\u002Fp>\n          <p style=\"margin-bottom:14px;\"><b style=\"color:var(--ink);\">3.3.<\u002Fb> Nestes casos, não se aplica a regra dos 3 meses referida no ponto 1.1.<\u002Fp>\n\n          <div style=\"font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;\">4 · Disposições Finais<\u002Fdiv>\n          <p style=\"margin-bottom:6px;\"><b style=\"color:var(--ink);\">4.1.<\u002Fb> A atribuição do cartão oferta está sempre condicionada à validação e confirmação do pagamento da apólice.<\u002Fp>\n          <p style=\"margin-bottom:4px;\"><b style=\"color:var(--ink);\">4.2.<\u002Fb> A entidade promotora reserva-se o direito de alterar ou terminar a campanha a qualquer momento, sem prejuízo das apólices já elegíveis à data da alteração.<\u002Fp>\n        <\u002Fdiv>\n        <button class=\"btn ghost\" style=\"margin-top:18px;\" data-close=\"sh-terms\"><span>Compreendi<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- info: apólices activas -->\n    <div class=\"sheet-wrap\" id=\"sh-apol-info\">\n      <div class=\"sheet\">\n        <div class=\"handle\"><\u002Fdiv>\n        <div class=\"ttl\"><h3>Apólices <em>activas.<\u002Fem><\u002Fh3><button class=\"x\" data-close=\"sh-apol-info\">✕<\u002Fbutton><\u002Fdiv>\n        <div class=\"sub\">O que significa este valor<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.55;color:var(--ink-2);\">\n          <p style=\"margin-bottom:12px;\">O valor apresentado representa o <b style=\"color:var(--ink);\">investimento diário<\u002Fb> que faz na sua proteção e da sua família através das apólices activas na sua wallet.<\u002Fp>\n          <p style=\"margin-bottom:12px;\">O cálculo divide o <b style=\"color:var(--ink);\">total anual das apólices<\u002Fb> por <b style=\"color:var(--ink);\">365 dias<\u002Fb> — assim consegue perceber quanto está realmente a investir na sua tranquilidade, dia após dia.<\u002Fp>\n          <div style=\"background:#F4F1EA;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--ink);line-height:1.5;\">\n            Ex.: total anual 2.000€<br>Investimento diário = <b style=\"color:var(--ink);font-weight:700;\">5,47€/dia<\u002Fb>\n          <\u002Fdiv>\n          <p style=\"margin-top:12px;font-size:11px;color:var(--muted);\">Os cones ao lado representam os ramos das apólices actualmente activas.<\u002Fp>\n        <\u002Fdiv>\n        <button class=\"btn ghost\" style=\"margin-top:18px;\" data-close=\"sh-apol-info\"><span>Compreendi<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- info: competitividade -->\n    <div class=\"sheet-wrap\" id=\"sh-comp-info\">\n      <div class=\"sheet\">\n        <div class=\"handle\"><\u002Fdiv>\n        <div class=\"ttl\"><h3>Competitividade <em>global.<\u002Fem><\u002Fh3><button class=\"x\" data-close=\"sh-comp-info\">✕<\u002Fbutton><\u002Fdiv>\n        <div class=\"sub\">O que significa este valor<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.55;color:var(--ink-2);\">\n          <p style=\"margin-bottom:12px;\">O valor em <b style=\"color:#0EA25F;\">verde<\u002Fb> representa a <b style=\"color:var(--ink);\">poupança estimada<\u002Fb> que consegue ao ter as suas apólices centralizadas na mediação Edgar Azevedo — não é só o que paga a menos, mas também o que ganha em coberturas mais completas face às congéneres do mercado.<\u002Fp>\n          <p style=\"margin-bottom:12px;\">Ao ter mais do que uma apólice na nossa mediação, acumula um desconto contínuo, ano após ano, até <b style=\"color:var(--ink);\">20% nos seus seguros<\u002Fb> — a partir da 2.ª apólice.<\u002Fp>\n          <div style=\"background:#F4F1EA;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--ink);line-height:1.5;\">\n            Ex.: 5 apólices · 1.500€/ano<br>Poupança estimada = <b style=\"color:#0EA25F;font-weight:700;\">300€/ano<\u002Fb>\n          <\u002Fdiv>\n          <p style=\"margin-top:12px;font-size:11px;color:var(--muted);\">Nota: este valor não dispensa a consulta da informação pré-contratual legalmente exigida. Fale com o seu mediador e descubra as vantagens de centralizar as suas apólices na palma da sua mão.<\u002Fp>\n        <\u002Fdiv>\n        <button class=\"btn ghost\" style=\"margin-top:18px;\" data-close=\"sh-comp-info\"><span>Compreendi<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- notifs sheet -->\n    <div class=\"sheet-wrap\" id=\"sh-notifs\">\n      <div class=\"sheet\" style=\"max-height:80%;\">\n        <div class=\"handle\"><\u002Fdiv>\n        <div class=\"ttl\"><h3>Renovações <em>a caminho.<\u002Fem><\u002Fh3><button class=\"x\" data-close=\"sh-notifs\">✕<\u002Fbutton><\u002Fdiv>\n        <div class=\"body-s\" style=\"margin-top:4px;\">Avisamos com <b style=\"color:var(--ink);\">30 dias<\u002Fb> de antecedência para cada apólice activa.<\u002Fdiv>\n        <div id=\"notifs-list\" style=\"margin-top:14px;display:flex;flex-direction:column;gap:8px;\"><\u002Fdiv>\n        <button class=\"btn ghost\" style=\"margin-top:14px;\" data-close=\"sh-notifs\"><span>Fechar<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- gestor sheet -->\n    <div class=\"sheet-wrap\" id=\"sh-gestor\">\n      <div class=\"sheet\">\n        <div class=\"handle\"><\u002Fdiv>\n        <div class=\" =\"margin-bottom:12px;\"><b style=\"color:var(--ink);\">O que precisa:<\u002Fb><\u002Fp>\n          <ul style=\"list-style:none;padding:0;margin:0 0 12px;\">\n            <li style=\"padding:6px 0;border-bottom:1px dashed var(--line);\">1. Nome da apólice actual<\u002Fli>\n            <li style=\"padding:6px 0;border-bottom:1px dashed var(--line);\">2. Seguradora onde está actualmente<\u002Fli>\n            <li style=\"padding:6px 0;border-bottom:1px dashed var(--line);\">3. Data de renovação (para tratarmos com antecedência)<\u002Fli>\n            <li style=\"padding:6px 0;\">4. Cópia da última apólice (opcional — facilita o processo)<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <button class=\"btn ghost\" style=\"margin-top:18px;\" data-close=\"sh-transfer-info\"><span>Compreendi<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- form: transferir seguro -->\n    <div class=\"sheet-wrap\" id=\"sh-transfer\">\n      <div class=\"sheet\">\n        <div class=\"handle\"><\u002Fdiv>\n        <div class=\"ttl\"><h3>Transferir <em>seguro.<\u002Fem><\u002Fh3><button class=\"x\" data-close=\"sh-transfer\">✕<\u002Fbutton><\u002Fdiv>\n        <div class=\"sub\">O seu gestor trata do resto<\u002Fdiv>\n\n        <div style=\"margin-bottom:14px;\">\n          <div class=\"lbl\" style=\"margin-bottom:6px;\">Tipo<\u002Fdiv>\n          <div class=\"seg\" id=\"tr-tipo\">\n            <div class=\"b on\" data-tipo=\"individual\">Individual<\u002Fdiv>\n            <div class=\"b\" data-tipo=\"empresa\">Empresa<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"input-wrap\" id=\"tr-emp-nif-wrap\" style=\"display:none;\"><span class=\"lbl\">NIF da empresa<\u002Fspan><input class=\"input\" id=\"tr-emp-nif\" type=\"text\" placeholder=\"500 000 000\"><\u002Fdiv>\n\n        <div style=\"margin-bottom:14px;\">\n          <div class=\"lbl\" style=\"margin-bottom:6px;\">Ramo<\u002Fdiv>\n          <div class=\"seg-scroll\" data-group=\"tr-ramo\">\n            <div class=\"pick\" data-pick=\"Auto\">🚗 Auto<\u002Fdiv>\n            <div class=\"pick on\" data-pick=\"Saúde\">➕ Saúde<\u002Fdiv>\n            <div class=\"pick\" data-pick=\"Vida\">❤️ Vida<\u002Fdiv>\n            <div class=\"pick\" data-pick=\"Casa\">🏠 Casa<\u002Fdiv>\n            <div class=\"pick\" data-pick=\"Outro\">✨ Outro<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"field\"><textarea id=\"tr-nota\" rows=\"5\" placeholder=\"Descreva brevemente o que pretende — seguradora actual, valor, coberturas, motivo...\" style=\"width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:var(--sans);font-size:13px;color:var(--ink);resize:vertical;min-height:110px;line-height:1.45;\"><\u002Ftextarea><\u002Fdiv>\n\n        <button class=\"btn accent\" style=\"margin-top:14px;\" data-act=\"transferir-send\"><span>Avaliar transferência<\u002Fspan><span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- empresa login -->\n    <div class=\"sheet-wrap\" id=\"sh-empresa-login\">\n      <div class=\"sheet\">\n        <div class=\"handle\"><\u002Fdiv>\n        <div class=\"ttl\"><h3>Acesso <em>Empresa.<\u002Fem><\u002Fh3><button class=\"x\" data-close=\"sh-empresa-login\">✕<\u002Fbutton><\u002Fdiv>\n        <div id=\"emp-step1\">\n          <div class=\"sub\">Indique o NIF e o email associados à empresa — os dados são confirmados com o seu agente<\u002Fdiv>\n          <div class=\"input-wrap\"><span class=\"lbl\">NIF da empresa<\u002Fspan><input class=\"input\" id=\"emp-nif\" type=\"text\" placeholder=\"500 000 000\"><\u002Fdiv>\n          <div class=\"input-wrap\"><span class=\"lbl\">Email associado<\u002Fspan><input class=\"input\" id=\"emp-email\" type=\"email\" placeholder=\"empresa@exemplo.pt\"><\u002Fdiv>\n          <div class=\"err-msg\" id=\"emp-login-err\"><\u002Fdiv>\n          <button class=\"btn accent\" style=\"margin-top:14px;\" data-act=\"empresa-login-submit\"><span>Confirmar dados com o agente<\u002Fspan><span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"emp-step2\" style=\"display:none;\">\n          <div class=\"sub\" id=\"emp-code-msg\">Aguarde o código do seu agente<\u002Fdiv>\n          <div class=\"input-wrap\"><span class=\"lbl\">Código de acesso<\u002Fspan><input class=\"input\" id=\"emp-code\" type=\"text\" inputmode=\"numeric\" placeholder=\"0000\"><\u002Fdiv>\n          <div class=\"err-msg\" id=\"emp-code-err\"><\u002Fdiv>\n          <button class=\"btn accent\" style=\"margin-top:14px;\" data-act=\"empresa-code-verify\"><span>Aceder<\u002Fspan><span class=\"arr\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- toast -->\n    <div class=\"toast\" id=\"toast\"><span class=\"ck\">✓<\u002Fspan><span id=\"toast-msg\"><\u002Fspan><\u002Fdiv>\n\n    <!-- birthday banner -->\n    <div class=\"notif-banner\" id=\"bday-banner\" data-act=\"\" onclick=\"this.classList.remove('show')\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px;\">\n        <div style=\"width:22px;height:22px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:-0.04em;\">EX<\u002Fdiv>\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:0.02em;flex:1;\">EXA SEGUROS<\u002Fspan>\n        <span style=\"font-size:10px;color:var(--muted);\">agora<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--display);font-size:15px;font-weight:600;line-height:1.2;margin-bottom:4px;\" id=\"bday-text\"><\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--ink-2);\">Estamos ao seu dispor. — Edgar Azevedo · seu gestor<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv><!-- /phone -->\n<\u002Fdiv><!-- /stage -->\n\n<script src=\"305efd1e-607e-41da-9409
